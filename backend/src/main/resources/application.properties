# ==========================================
# APPLICATION
# ==========================================
spring.application.name=vpms-service

server.port=3031

server.servlet.context-path=/vpms

# ==========================================
# ORACLE DATABASE CONFIGURATION
# ==========================================
#spring.datasource.url=jdbc:oracle:thin:@192.168.9.21:1521:LX2
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.datasource.username=cw
#spring.datasource.password=cw999

spring.datasource.url=jdbc:oracle:thin:@192.168.9.21:1521:LX2
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=cw
spring.datasource.password=cw999

# ==========================================
# HIKARICP CONNECTION POOL
# ==========================================
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=VpmsHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.jdbc.use_scrollable_resultset=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# FILE UPLOAD
# ==========================================
app.upload.dir=//192.168.31.251//FileManager//VpmsFiles//
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=150MB

