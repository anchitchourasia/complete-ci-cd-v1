# ==============================================================================
# GitHub Actions CI/CD Pipeline - complete-ci-cd-v1
# Purpose: Automatically builds Java 17 Spring Boot WAR application, runs tests,
#          and deploys the WAR to local Apache Tomcat 10.1 on push.
# ==============================================================================
name: CI/CD Pipeline - complete-ci-cd-v1

# ------------------------------------------------------------------------------
# 1. Pipeline Event Triggers (When does this workflow run?)
# ------------------------------------------------------------------------------
on:
  # Triggers automatically when code is pushed to 'main' or 'm1' branches
  push:
    branches: [main, m1]
  # Triggers automatically when a Pull Request is opened/updated targeting 'main'
  pull_request:
    branches: [main]

# ------------------------------------------------------------------------------
# 2. Default Shell Settings
# ------------------------------------------------------------------------------
defaults:
  run:
    shell: powershell # Executes all inline PowerShell script commands on Windows host

# ------------------------------------------------------------------------------
# 3. Global Environment Variables
# ------------------------------------------------------------------------------
env:
  # Absolute path to the Maven command-line tool script on the Windows runner PC
  MAVEN_BIN: 'C:\maven\apache-maven-3.9.12\59fe215c0ad6947fea90184bf7add084544567b927287592651fda3782e0e798\bin\mvn.cmd'
  
  # Absolute path to Maven settings XML file containing repository mirror configurations
  SETTINGS_XML: 'C:\maven\settings.xml'
  
  # Path to Java 17 JDK installation directory
  JAVA_HOME: 'C:\Program Files\Java\jdk-17'
  
  # Corporate proxy settings for outbound internet HTTP/HTTPS requests
  HTTP_PROXY: 'http://192.168.9.112:808'
  HTTPS_PROXY: 'http://192.168.9.112:808'
  
  # Local addresses that bypass the corporate proxy (localhost, 127.0.0.1)
  NO_PROXY: '192.168.8.25,localhost,127.0.0.1'
  
  # JVM Heap Memory Limit (-Xms256m starting memory, -Xmx512m maximum memory)
  # Prevents Windows pagefile virtual memory errors (errno 1455) during Maven builds
  MAVEN_OPTS: '-Xmx512m -Xms256m'

# ------------------------------------------------------------------------------
# 4. Pipeline Jobs
# ------------------------------------------------------------------------------
jobs:
  # ============================================================================
  # JOB 1: Build & Test (Runs on Push and Pull Request)
  # Purpose: Clones code, compiles Java 17, runs JUnit tests, packages target/ci-cd-demo.war,
  #          and uploads the WAR file as a GitHub Actions workflow artifact.
  # ============================================================================
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, Windows] # Runs on self-hosted Windows runner daemon
    steps:
      # Step 1: Downloads (clones) repository code into the runner workspace folder
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Compiles Java 17 code, executes JUnit unit tests, and packages WAR
      - name: Build WAR and run tests
        run: |
          # Add Java 17 bin directory to environment PATH variable
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          
          # Execute Maven clean verify to run tests and package ci-cd-demo.war
          & $env:MAVEN_BIN -s $env:SETTINGS_XML clean verify --no-transfer-progress
          
          # Fail step immediately if Maven returns an error code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Step 3: Uploads target/ci-cd-demo.war as an artifact for Job 2 (deploy)
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-war
          path: target/ci-cd-demo.war

  # ============================================================================
  # JOB 2: Deploy to Tomcat (Runs ONLY on Push events)
  # Purpose: Downloads the tested WAR artifact and copies it to local Tomcat webapps folder.
  # ============================================================================
  deploy:
    name: Deploy to Tomcat
    runs-on: [self-hosted, Windows]
    needs: build-and-test        # Waits for Job 1 (build-and-test) to succeed first
    if: github.event_name == 'push' # Runs only on code push (skips deployment on Pull Requests)
    steps:
      # Step 1: Downloads the tested WAR artifact built in Job 1 into ./deploy-artifact/
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-cd-demo-war
          path: deploy-artifact

      # Step 2: Copies ci-cd-demo.war to Tomcat's webapps folder (triggers Tomcat auto-deployment)
      - name: Copy WAR to Tomcat webapps
        run: |
          # Define local Tomcat webapps target folder
          $tomcatWebapps = 'E:\apache-tomcat-10.1.28\webapps'
          
          # Construct absolute path to downloaded WAR artifact
          $warSource = Join-Path $env:GITHUB_WORKSPACE 'deploy-artifact\ci-cd-demo.war'
          
          # Validate that both source WAR file and target webapps folder exist
          if (-not (Test-Path $warSource)) { throw "WAR file not found!" }
          if (-not (Test-Path $tomcatWebapps)) { throw "Tomcat webapps directory not found!" }

          # Copy WAR file to Tomcat webapps (Tomcat automatically unpacks & deploys the app)
          Copy-Item -LiteralPath $warSource -Destination $tomcatWebapps -Force
          
          # Output deployment success confirmation and live endpoint URL
          Write-Host "SUCCESS: WAR deployed to Tomcat at $tomcatWebapps"
          Write-Host "Application Endpoint: http://localhost:8090/ci-cd-demo/test/msg"