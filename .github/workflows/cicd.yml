name: CI/CD Pipeline - complete-ci-cd-v1

on:
  push:
    branches: [main, m1]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  MAVEN_BIN: 'C:\maven\apache-maven-3.9.12\59fe215c0ad6947fea90184bf7add084544567b927287592651fda3782e0e798\bin\mvn.cmd'
  SETTINGS_XML: 'C:\maven\settings.xml'
  JAVA_HOME: 'C:\Program Files\Java\jdk-17'
  HTTP_PROXY: 'http://192.168.9.112:808'
  HTTPS_PROXY: 'http://192.168.9.112:808'
  NO_PROXY: '192.168.8.25,localhost,127.0.0.1'
  MAVEN_OPTS: '-Xmx512m -Xms256m'

jobs:
  build-and-test:
    name: Build & Test (Maven)
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check local JDK and Maven
        run: |
          if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) { throw "JDK not found: $env:JAVA_HOME" }
          if (-not (Test-Path $env:MAVEN_BIN)) { throw "Maven not found: $env:MAVEN_BIN" }
          if (-not (Test-Path $env:SETTINGS_XML)) { throw "Maven settings not found: $env:SETTINGS_XML" }
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          & $env:MAVEN_BIN -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WAR and run tests
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          & $env:MAVEN_BIN -s $env:SETTINGS_XML clean verify --no-transfer-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-war
          path: target/ci-cd-demo.war
          if-no-files-found: error
          retention-days: 7

  code-quality:
    name: Code Quality Check (Maven verify)
    runs-on: [self-hosted, Windows]
    needs: build-and-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Maven verify
        run: |
          if (-not (Test-Path $env:MAVEN_BIN)) { throw "Maven not found: $env:MAVEN_BIN" }
          if (-not (Test-Path $env:SETTINGS_XML)) { throw "Maven settings not found: $env:SETTINGS_XML" }
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          & $env:MAVEN_BIN -s $env:SETTINGS_XML verify -DskipTests --no-transfer-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    name: Deploy to Local Tomcat
    runs-on: [self-hosted, Windows]
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: local-tomcat-deploy
      cancel-in-progress: false
    steps:
      - name: Download tested WAR
        uses: actions/download-artifact@v4
        with:
          name: ci-cd-demo-war
          path: deploy-artifact

      - name: Deploy WAR to Tomcat webapps
        env:
          TOMCAT_WEBAPPS_PATH: ${{ secrets.TOMCAT_WEBAPPS_PATH }}
        run: |
          $targetPath = $env:TOMCAT_WEBAPPS_PATH
          if ([string]::IsNullOrWhiteSpace($targetPath)) {
            $targetPath = 'E:\apache-tomcat-10.1.28\webapps'
            Write-Host "TOMCAT_WEBAPPS_PATH secret not set. Using local default: $targetPath"
          }
          $warSrc = Join-Path $env:GITHUB_WORKSPACE 'deploy-artifact\ci-cd-demo.war'
          if (-not (Test-Path $warSrc -PathType Leaf)) { throw "WAR not found: $warSrc" }
          if (-not (Test-Path $targetPath -PathType Container)) {
            throw "Tomcat webapps directory not found: $targetPath"
          }
          $warDest = Join-Path $targetPath 'ci-cd-demo.war'

          $tomcatBase = Split-Path -Path $targetPath -Parent
          $logsDir = Join-Path $tomcatBase 'logs'
          $todayStr = Get-Date -Format "yyyy-MM-dd"
          $catalinaLog = Join-Path $logsDir "catalina.$todayStr.log"

          # Record initial log size and timestamp before copying WAR
          $deployStartTime = Get-Date
          $initialLogSize = 0
          if (Test-Path $catalinaLog) {
            $initialLogSize = (Get-Item $catalinaLog).Length
          }

          Copy-Item -LiteralPath $warSrc -Destination $warDest -Force -ErrorAction Stop
          Write-Host "WAR copied to $warDest at $deployStartTime. Waiting for Tomcat auto-deployment..."

          # Bounded polling for Tomcat redeployment & HTTP health check (max 45 seconds)
          $timeoutSec = 45
          $elapsedSec = 0
          $pollIntervalSec = 3
          $deployedVerified = $false

          # Temporarily clear proxy env vars to ensure local localhost connection bypasses corporate proxy
          $oldHttpProxy = $env:HTTP_PROXY
          $oldHttpsProxy = $env:HTTPS_PROXY
          $env:HTTP_PROXY = ""
          $env:HTTPS_PROXY = ""

          try {
            while ($elapsedSec -lt $timeoutSec) {
              Start-Sleep -Seconds $pollIntervalSec
              $elapsedSec += $pollIntervalSec

              try {
                $response = Invoke-WebRequest -Uri "http://localhost:8090/ci-cd-demo/test/msg" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
                if ($response.StatusCode -eq 200 -and $response.Content -match "Hello Test Controller") {
                  $deployedVerified = $true
                  Write-Host "HTTP Health Check PASSED: 200 OK - '$($response.Content.Trim())'"
                  break
                }
              } catch {
                Write-Host "Waiting for Tomcat endpoint to respond... ($elapsedSec/$timeoutSec s)"
              }
            }
          } finally {
            $env:HTTP_PROXY = $oldHttpProxy
            $env:HTTPS_PROXY = $oldHttpsProxy
          }

          # Stream NEW Tomcat log entries created during this deployment
          if (Test-Path $catalinaLog) {
            $currentLog = Get-Item $catalinaLog
            if ($currentLog.Length -gt $initialLogSize) {
              Write-Host "=== New Tomcat Log Entries (catalina.$todayStr.log) ==="
              $stream = [System.IO.File]::Open($catalinaLog, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $reader = New-Object System.IO.StreamReader($stream)
              $stream.Position = $initialLogSize
              $newLogContent = $reader.ReadToEnd()
              $reader.Close()
              $stream.Close()

              $relevantLines = $newLogContent -split "`r?\n" | Where-Object { $_ -match "ci-cd-demo" -or $_ -match "HostConfig" -or $_ -match "Exception" -or $_ -match "Error" }
              if ($relevantLines) {
                $relevantLines | ForEach-Object { Write-Host $_ }
              }
            }
          }

          if (-not $deployedVerified) {
            throw "Deployment Failed: Application at http://localhost:8090/ci-cd-demo/test/msg failed to respond with HTTP 200 and expected payload within $timeoutSec seconds."
          }

          Write-Host "Deployment completed and verified successfully!"
