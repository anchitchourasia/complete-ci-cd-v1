# ==============================================================================
# GitHub Actions CI/CD Pipeline - complete-ci-cd-v1
# Purpose: Automatically builds Java 17 Spring Boot WAR application, runs tests,
#          starts local Apache Tomcat 10.1 if needed, and deploys the WAR on push.
# ==============================================================================

name: CI/CD Pipeline - complete-ci-cd-v1

# ------------------------------------------------------------------------------
# 1. Pipeline Event Triggers (When does this workflow run?)
# ------------------------------------------------------------------------------
on:
  # Triggers automatically when code is pushed to 'main' or 'm1' branches
  push:
    branches: [main, m1]

  # Triggers automatically when a Pull Request is opened/updated targeting 'main'
  pull_request:
    branches: [main]

# ------------------------------------------------------------------------------
# 2. Default Shell Settings
# ------------------------------------------------------------------------------
defaults:
  run:
    shell: powershell

# ------------------------------------------------------------------------------
# 3. Global Environment Variables
# ------------------------------------------------------------------------------
env:
  # Absolute path to the Maven command-line tool script on the Windows runner PC
  MAVEN_BIN: 'C:\maven\apache-maven-3.9.12\59fe215c0ad6947fea90184bf7add084544567b927287592651fda3782e0e798\bin\mvn.cmd'

  # Absolute path to Maven settings XML file containing repository mirror configurations
  SETTINGS_XML: 'C:\maven\settings.xml'

  # Path to Java 17 JDK installation directory
  JAVA_HOME: 'C:\Program Files\Java\jdk-17'

  # Corporate proxy settings for outbound internet HTTP/HTTPS requests
  HTTP_PROXY: 'http://192.168.9.112:808'
  HTTPS_PROXY: 'http://192.168.9.112:808'

  # Local addresses that bypass the corporate proxy
  NO_PROXY: '192.168.8.25,localhost,127.0.0.1'

  # JVM memory settings for Maven
  MAVEN_OPTS: '-Xmx512m -Xms256m'

# ------------------------------------------------------------------------------
# 4. Pipeline Jobs
# ------------------------------------------------------------------------------
jobs:
  # ============================================================================
  # JOB 1: Build & Test (Runs on Push and Pull Request)
  # ============================================================================
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, Windows]

    steps:
      # Step 1: Downloads repository code into the runner workspace
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Compiles Java 17 code, runs JUnit tests, and packages the WAR
      - name: Build WAR and run tests
        run: |
          # Add Java 17 bin directory to PATH
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

          # Execute Maven build, test, and package
          & $env:MAVEN_BIN -s $env:SETTINGS_XML clean verify --no-transfer-progress

          # Mark workflow as failed if Maven fails
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Step 3: Uploads the built WAR for the deploy job
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-war
          path: target/ci-cd-demo.war

  # ============================================================================
  # JOB 2: Deploy to Tomcat (Runs only on Push)
  # ============================================================================
  deploy:
    name: Deploy to Tomcat
    runs-on: [self-hosted, Windows]
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      # Step 1: Downloads the tested WAR from GitHub Actions artifact storage
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-cd-demo-war
          path: deploy-artifact

      # Step 2: Starts Tomcat only if port 8090 is not already listening
      - name: Start Tomcat if it is not running
        run: |
          $tomcatPort = 8090
          $tomcatBin = 'E:\apache-tomcat-10.1.28\bin'
          $startupBat = Join-Path $tomcatBin 'startup.bat'

          # Check whether an application is listening on port 8090
          $listener = Get-NetTCPConnection `
            -LocalPort $tomcatPort `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            Write-Host "Tomcat is stopped. Starting Tomcat..."

            if (-not (Test-Path $startupBat -PathType Leaf)) {
              throw "Tomcat startup.bat not found: $startupBat"
            }

            # Starts startup.bat without blocking the GitHub Actions job
            Start-Process `
              -FilePath $startupBat `
              -WorkingDirectory $tomcatBin `
              -WindowStyle Hidden

            # Wait up to 45 seconds for Tomcat to listen on 8090
            $deadline = (Get-Date).AddSeconds(45)

            do {
              Start-Sleep -Seconds 2

              $listener = Get-NetTCPConnection `
                -LocalPort $tomcatPort `
                -State Listen `
                -ErrorAction SilentlyContinue
            }
            while ($null -eq $listener -and (Get-Date) -lt $deadline)

            if ($null -eq $listener) {
              throw "Tomcat did not start on port $tomcatPort within 45 seconds."
            }

            Write-Host "Tomcat started successfully and is listening on port $tomcatPort."
          }
          else {
            Write-Host "Tomcat is already running on port $tomcatPort."
          }

      # Step 3: Copies the downloaded WAR into Tomcat's webapps directory
      - name: Copy WAR to Tomcat webapps
        run: |
          # Target directory where Tomcat monitors WAR files
          $tomcatWebapps = 'E:\apache-tomcat-10.1.28\webapps'

          # Exact WAR file downloaded from the successful Build & Test job
          $warSource = Join-Path $env:GITHUB_WORKSPACE 'deploy-artifact\ci-cd-demo.war'

          if (-not (Test-Path $warSource -PathType Leaf)) {
            throw "WAR file not found: $warSource"
          }

          if (-not (Test-Path $tomcatWebapps -PathType Container)) {
            throw "Tomcat webapps directory not found: $tomcatWebapps"
          }

          # Replaces the existing WAR; Tomcat auto-detects and redeploys it
          Copy-Item -LiteralPath $warSource -Destination $tomcatWebapps -Force

          Write-Host "SUCCESS: WAR deployed to Tomcat at $tomcatWebapps"
          Write-Host "Application Endpoint: http://127.0.0.1:8090/ci-cd-demo/test/msg"