name: CI/CD Pipeline - complete-ci-cd-v1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Maven)
    runs-on: self-hosted          # uses your local Windows runner

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests for speed)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Run unit tests
        run: mvn test --no-transfer-progress

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-demo-war
          path: target/ci-cd-demo.war
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 : Code Quality Check
  # ─────────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify (integration check)
        run: mvn verify --no-transfer-progress -DskipTests

  # ─────────────────────────────────────────────
  # Job 3 : Deploy (WAR → Tomcat webapps folder)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Local Tomcat
    runs-on: self-hosted
    needs: [ build-and-test, code-quality ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR for deployment
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Deploy WAR to Tomcat webapps
        shell: pwsh
        run: |
          $WAR_SRC  = "target\ci-cd-demo.war"
          $TOMCAT_WEBAPPS = $env:TOMCAT_WEBAPPS_PATH

          if (-not $TOMCAT_WEBAPPS) {
            Write-Host "::warning::TOMCAT_WEBAPPS_PATH secret not set – skipping Tomcat deploy."
            Write-Host "Set the secret in: Settings → Secrets → Actions → New repository secret"
            exit 0
          }

          if (-not (Test-Path $TOMCAT_WEBAPPS)) {
            Write-Error "Tomcat webapps directory not found: $TOMCAT_WEBAPPS"
            exit 1
          }

          Write-Host "Copying $WAR_SRC → $TOMCAT_WEBAPPS\ci-cd-demo.war"
          Copy-Item -Force $WAR_SRC "$TOMCAT_WEBAPPS\ci-cd-demo.war"
          Write-Host "✅ Deployment complete!"
        env:
          TOMCAT_WEBAPPS_PATH: ${{ secrets.TOMCAT_WEBAPPS_PATH }}

      - name: Deployment summary
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " CI/CD Pipeline Summary"
          Write-Host "========================================"
          Write-Host " Repo    : ${{ github.repository }}"
          Write-Host " Branch  : ${{ github.ref_name }}"
          Write-Host " Commit  : ${{ github.sha }}"
          Write-Host " Run #   : ${{ github.run_number }}"
          Write-Host " Status  : SUCCESS ✅"
          Write-Host "========================================"
