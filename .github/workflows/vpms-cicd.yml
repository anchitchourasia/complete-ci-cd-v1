name: CI/CD Pipeline - VPMS Docker Test

on:
  push:
    branches: [backend]
  workflow_dispatch:

defaults:
  run:
    shell: powershell

env:
  MAVEN_BIN: 'C:\maven\apache-maven-3.9.12\59fe215c0ad6947fea90184bf7add084544567b927287592651fda3782e0e798\bin\mvn.cmd'
  SETTINGS_XML: 'C:\maven\settings.xml'
  JAVA_HOME: 'C:\Program Files\Java\jdk-17'
  HTTP_PROXY: "http://192.168.9.112:808"
  HTTPS_PROXY: "http://192.168.9.112:808"
  NO_PROXY: "192.168.8.25,localhost,127.0.0.1"
  MAVEN_OPTS: "-Xmx512m -Xms256m"

  APP_DIR: "vehiclePassManagementSystem"
  WAR_FILE: "vpms.war"

  DOCKER_IMAGE: "vpms:1.0"
  DOCKER_CONTAINER: "vpms-container"
  DOCKER_HOST_PORT: "8092"
  DOCKER_CONTAINER_PORT: "3031"
  DOCKER_BIN: 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'

jobs:
  build-and-run-docker:
    name: Build and Run VPMS Docker
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build VPMS WAR
        working-directory: vehiclePassManagementSystem
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

          & $env:MAVEN_BIN -s $env:SETTINGS_XML clean package --no-transfer-progress

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check Docker
        run: |
          if (-not (Test-Path $env:DOCKER_BIN)) {
            throw "Docker executable was not found: $env:DOCKER_BIN"
          }

          & $env:DOCKER_BIN version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is not available."
          }

      - name: Build VPMS Docker image
        run: |
          $dockerfilePath = Join-Path $env:GITHUB_WORKSPACE "$env:APP_DIR\Dockerfile"
          $warPath = Join-Path $env:GITHUB_WORKSPACE "$env:APP_DIR\target\$env:WAR_FILE"

          if (-not (Test-Path $dockerfilePath)) {
            throw "Dockerfile not found: $dockerfilePath"
          }

          if (-not (Test-Path $warPath)) {
            throw "WAR file not found: $warPath"
          }

          & $env:DOCKER_BIN build `
            --progress=plain `
            -t $env:DOCKER_IMAGE `
            -f $dockerfilePath `
            "$env:GITHUB_WORKSPACE\$env:APP_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Remove old VPMS Docker container
        run: |
          $existingContainer = & $env:DOCKER_BIN ps -a `
            --filter "name=^$env:DOCKER_CONTAINER$" `
            --format "{{.Names}}"

          if ($existingContainer -eq $env:DOCKER_CONTAINER) {
            & $env:DOCKER_BIN rm --force $env:DOCKER_CONTAINER

            if ($LASTEXITCODE -ne 0) {
              throw "Old VPMS container could not be removed."
            }
          }

      - name: Run VPMS Docker container
        run: |
          $containerId = & $env:DOCKER_BIN run -d `
            --name $env:DOCKER_CONTAINER `
            -p "$env:DOCKER_HOST_PORT`:$env:DOCKER_CONTAINER_PORT" `
            $env:DOCKER_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "VPMS Docker container could not be started."
          }

          Write-Host "VPMS container started: $containerId"

      - name: Check VPMS container logs
        run: |
          Start-Sleep -Seconds 15

          & $env:DOCKER_BIN ps -a --filter "name=^$env:DOCKER_CONTAINER$"
          & $env:DOCKER_BIN logs --tail 150 $env:DOCKER_CONTAINER

          $containerStatus = & $env:DOCKER_BIN inspect `
            --format "{{.State.Status}}" `
            $env:DOCKER_CONTAINER

          if ($containerStatus -ne "running") {
            throw "VPMS container is not running. Status: $containerStatus"
          }