name: Frontend CI/CD

on:
  workflow_call:

permissions:
  contents: read

env:
  FRONTEND_DIR: Frontend
  NODE_VERSION: "24"
  BUILD_SCRIPT: build
  BUILD_CONFIGURATION: "production,kubernetes"

  OUTPUT_BASE: dist/vpms-ui-k8s

  DOCKER_IMAGE: "vpms-frontend:k8s-${{ github.run_id }}-${{ github.run_attempt }}"

  K8S_CONTEXT: "docker-desktop"
  K8S_NAMESPACE: "vpms-dev"
  DOCKER_CONTAINER: vpms-frontend
  HOST_PORT: "14200"
  CONTAINER_PORT: "80"
  DOCKER_BIN: 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'

  HTTP_PROXY: "http://192.168.9.112:808"
  HTTPS_PROXY: "http://192.168.9.112:808"
  NO_PROXY: "192.168.8.25,localhost,127.0.0.1,::1,kubernetes.docker.internal,host.docker.internal"

defaults:
  run:
    shell: powershell

jobs:
  frontend:
    name: Build and Deploy Frontend
    runs-on: [self-hosted, Windows]

    concurrency:
      group: vpms-frontend-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Copy local Angular environment configuration
        run: |
          $source = 'D:\frontend pipeline\VPMS_Frontend\Frontend\src\environments\environment.ts'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'Frontend\src\environments\environment.ts'

          if (-not (Test-Path $source -PathType Leaf)) {
            throw "Local Angular environment configuration was not found."
          }

          $destinationFolder = Split-Path -Parent $destination
          New-Item -ItemType Directory -Path $destinationFolder -Force | Out-Null

          Copy-Item -LiteralPath $source -Destination $destination -Force

          Write-Host "Angular environment configuration copied successfully."

      - name: Install dependencies and build Angular
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed."
          }

          npm.cmd run $env:BUILD_SCRIPT -- `
            "--configuration=$env:BUILD_CONFIGURATION" `
            "--output-path=$env:OUTPUT_BASE" `
            "--base-href=/vpms-ui/"

          if ($LASTEXITCODE -ne 0) {
            throw "Angular build failed."
          }

          if (-not (Test-Path "$env:OUTPUT_BASE/browser/index.html")) {
            throw "Angular build output is missing."
          }

      - name: Build Docker image
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          & $env:DOCKER_BIN info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is unavailable."
          }

          & $env:DOCKER_BIN build -f Dockerfile.k8s -t $env:DOCKER_IMAGE .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }
      - name: Deploy frontend to Kubernetes
        run: |
          $deploymentJson = kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get deployment vpms-frontend -o json
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend Deployment is unavailable to this runner."
          }

          $deployment = ($deploymentJson -join "`n") | ConvertFrom-Json
          $containers = @($deployment.spec.template.spec.containers)

          if ($containers.Count -ne 1) {
            throw "Expected one frontend container. Specify its name explicitly before deploying."
          }

          $containerName = $containers[0].name

          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE set image deployment/vpms-frontend "$containerName=$env:DOCKER_IMAGE"
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend image update failed."
          }

          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE scale deployment/vpms-frontend --replicas=2
          if ($LASTEXITCODE -ne 0) {
            throw "Could not set frontend replicas to 2."
          }

          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE rollout status deployment/vpms-frontend --timeout=300s
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend rollout did not complete within 300 seconds."
          }


      - name: Apply frontend Service and verify UI
        run: |
          $ErrorActionPreference = "Stop"

          # Bypass corporate proxies only in this Kubernetes/check step.
          foreach ($name in @("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY")) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:NO_PROXY = "*"

          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE apply -f k8s/21-frontend-service.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Could not apply the frontend Service."
          }

          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get service vpms-frontend -o wide
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read frontend Service status."
          }

          $url = "http://127.0.0.1:14200/vpms-ui/"
          $ready = $false

          $requestParameters = @{
            Uri             = $url
            UseBasicParsing = $true
            TimeoutSec      = 5
          }

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest @requestParameters

              if (
                $response.StatusCode -eq 200 -and
                $response.Content -match '(?i)<html'
              ) {
                $ready = $true
                break
              }
            }
            catch {
              Write-Host "Waiting for frontend Service: attempt $attempt of 30"
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get service vpms-frontend -o wide
            kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get pods -l app=vpms-frontend -o wide
            throw "Frontend HTTP check failed at $url"
          }

          Write-Host "Frontend HTML check passed."
          Write-Host "Login URL: http://localhost:14200/vpms-ui/#/login"

      - name: Show frontend deployment status
        run: |
          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get deployment vpms-frontend -o wide
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read frontend Deployment status."
          }

      - name: Frontend failure diagnostics
        if: failure()
        run: |
          kubectl --context $env:K8S_CONTEXT -n $env:K8S_NAMESPACE get events --sort-by=.metadata.creationTimestamp
          exit 0
