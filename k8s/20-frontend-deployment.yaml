apiVersion: apps/v1
kind: Deployment

metadata:
  name: vpms-frontend
  namespace: vpms-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vpms-frontend

  template:
    metadata:
      labels:
        app: vpms-frontend

    spec:
      automountServiceAccountToken: false

      containers:
        - name: frontend
          image: vpms-frontend:k8s-1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80