server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /vpms-ui/;
    }

    location = /vpms-ui {
        return 302 /vpms-ui/;
    }

    location /vpms-ui/ {
        try_files $uri $uri/ /vpms-ui/index.html;
    }

    location / {
        try_files $uri =404;
    }
}